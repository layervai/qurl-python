# Dependency Age Check (pip)
# Thin shim; logic lives in ops-routines reusable workflow.
name: Dependency Age Check (pip)

on:
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/requirements*.txt"
  workflow_dispatch:

jobs:
  age-check:
    uses: layervai/ops-routines/.github/workflows/age-check-pip.yml@61d51059f8a3b2654694bada12a542b2be8ae17c # v0.1.0
    with:
      working_directory: .
    permissions:
      contents: read
