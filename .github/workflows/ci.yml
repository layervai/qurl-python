name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel sibling matrix legs if one fails — we want full
      # visibility into which Python versions broke.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,langchain]"
      - name: Lint
        run: ruff check
      - name: Test
        run: pytest tests/ -v

  # ============================================================================
  # LOWER BOUND - Floor of the qurl-conformance range
  # ============================================================================
  # The matrix above installs the newest compatible qurl-conformance, so every
  # leg resolves the same 0.12.x / schema 2. That left the `1` in
  # SUPPORTED_SCHEMA_VERSIONS asserted only by a constant and a comment, while
  # the declared range still admits schema-1 releases for anyone resolving the
  # floor (an old lockfile, a --resolution lowest job, a constrained downstream
  # install). Pin the floor here so schema-1 compatibility is executed, not
  # claimed. Not in the matrix above: those three job names are required
  # contexts in branch protection and renaming them would strand every open PR.
  test-lowest:
    name: Test (conformance floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install dependencies at the conformance floor
        # 0.11.0 is the newest release still shipping qv2 artifact schema 1.
        run: pip install -e ".[dev,langchain]" "qurl-conformance==0.11.0"
      - name: Test
        run: pytest tests/ -v

  # ============================================================================
  # TYPE CHECK - Dedicated mypy job
  # ============================================================================
  # Runs in its own job so the gate can't silently vanish if the test
  # matrix is restructured. Pins to the minimum supported Python version
  # (matching `python_version` in pyproject.toml) so the strictness stays
  # aligned with what the SDK promises to consumers.
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install dependencies
        # Use the full dev+langchain extras so mypy sees the optional
        # langchain integration's real types. Without langchain-core
        # installed, mypy reports spurious errors about missing modules
        # and unused type-ignore comments in src/layerv_qurl/langchain.py.
        run: pip install -e ".[dev,langchain]"
      - name: Run mypy
        run: mypy src/

  # Slack build-completion card. Thin shim over the fleet-shared reusable
  # in layervai/ops-routines-workflows (public mirror of private
  # layervai/ops-routines); the curl/jq Block Kit payload builder and the
  # gate-result aggregation live there now. Adding/removing a gate is a
  # one-line edit to `needs:` + `gates:` here — no aggregation if-chain.
  notify:
    name: Notify
    needs: [test, test-lowest, type-check]
    if: always() && github.event_name != 'pull_request'
    permissions: {}
    uses: layervai/ops-routines-workflows/.github/workflows/notify.yml@47f516254213f3e250caa0eef43900dac548e208 # v0.10.0
    with:
      header: "qURL Python SDK Build"
      gates: '{"Tests": "${{ needs.test.result }}", "Conformance floor": "${{ needs.test-lowest.result }}", "Type check": "${{ needs.type-check.result }}"}'
      extra_fields: '{"Python": "3.10, 3.12, 3.13"}'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
